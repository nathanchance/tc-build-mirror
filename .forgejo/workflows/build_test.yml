name: Build test
on:
  push:
    branches:
      - personal
  workflow_dispatch:
enable-email-notifications: true
jobs:
  build-test:
    runs-on: docker-build
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: bash ci.sh deps
    - name: Build LLVM
      run: bash ci.sh llvm
    - name: Build Rust
      run: bash ci.sh rust
    - name: Build binutils
      run: bash ci.sh binutils
    - name: Build kernel
      run: bash ci.sh kernel
